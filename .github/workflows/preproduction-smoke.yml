name: Pre-production browser smoke test

on:
  workflow_run:
    workflows: ["Build and deploy OwSelector to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: preproduction-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop when the deployment workflow failed
        run: |
          node -e "const e=require(process.env.GITHUB_EVENT_PATH); process.exit(e.workflow_run.conclusion === 'success' ? 0 : 78)"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify loaded application
        env:
          PREPRODUCTION_URL: https://umeomilieuadvies.github.io/OwSelector-test/?revision=${{ github.event.workflow_run.head_sha }}
        run: EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)" node tools/verify_preproduction_browser.mjs
      - name: Bewaar browserdiagnose bij fout
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: preproduction-browser-diagnostics-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
