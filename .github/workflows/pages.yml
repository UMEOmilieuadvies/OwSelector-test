name: Build and deploy OwSelector to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Dagelijks 05:15 UTC: officiële BWB-bron opnieuw ophalen en vergelijken.
    - cron: '15 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.change_check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify client-side source
        run: |
          python tools/verify_workspace_boundaries.py
          node --check js/app-config.js
          node --check js/app.js
          node --check js/article-notes.js
          node --check js/jurisprudence.js
          node --check js/qna.js
          node --check js/beheer.js
          node tests/verify-client-source.mjs
          python tests/verify_release_tool.py
          node tests/verify-jurisprudence-data.mjs
          python tests/verify_jurisprudence_review.py
          node tests/verify-article-notes-layout.mjs
          node tests/verify-responsive-layout.mjs
          if find js -name '*.js' ! -name 'app-config.js' -print0 | xargs -0 grep -qE 'supabase\.co|sb_publishable_'; then
            echo 'Databasegegevens horen uitsluitend in js/app-config.js.'
            exit 1
          fi
      - name: Download official regulations
        run: python tools/download_all.py
      - name: Download official illustrations
        run: python tools/download_illustrations.py
      - name: Build legal graphs
        run: python tools/build_all.py
      - name: Retrieve previous article history cache
        run: |
          curl --fail --silent --show-error \
            https://umeomilieuadvies.github.io/OwSelector-test/data/article_history.json \
            --output data/article_history.json || true
      - name: Build official article history
        run: python tools/build_article_history.py
      - name: Verify graphs
        run: |
          python tests/verify_iwo_identity.py
          python tools/verify_runtime.py
      - name: Download official explanatory notes
        env:
          NVT_FALLBACK_BASE: https://umeomilieuadvies.github.io/OwSelector-test/data/nvt
        run: python tools/build_nvt_documents.py
      - name: Build article-specific explanatory notes
        run: python tools/build_article_notes_all.py
      - name: Assemble static site
        run: |
          mkdir -p _site/css _site/js _site/data/graph _site/data/illustrations _site/data/nvt
          cp help.html qna.html nvt.html nvt_catalog.json beheer.html historie.html article-notes.html jurisprudentie.html favicon.svg _site/
          cp release.json _site/release.json
          python tools/prepare_test_release.py
          cp -R images _site/images
          cp css/app.css _site/css/app.css
          cp js/app-config.js js/app.js js/beheer.js js/article-history.js _site/js/
          cp js/nvt.js _site/js/nvt.js
          cp js/article-notes.js js/jurisprudence.js _site/js/
          cp js/qna.js _site/js/qna.js
          cp data/external_refs.json _site/data/external_refs.json
          cp data/back_references.json _site/data/back_references.json
          cp data/regulation_versions.json _site/data/regulation_versions.json
          cp data/article_history.json _site/data/article_history.json
          cp data/article_notes_bal_chapter4.json _site/data/article_notes_bal_chapter4.json
          cp data/article_notes.json _site/data/article_notes.json
          cp data/jurisprudence.json _site/data/jurisprudence.json
          cp data/graph/*_legal_graph.json _site/data/graph/
          cp -R data/illustrations/. _site/data/illustrations/
          cp -R data/nvt/. _site/data/nvt/
          touch _site/.nojekyll
          node tests/create-promotion-candidate.mjs --output _site/promotion-candidate.json --commit "$GITHUB_SHA"
      - name: Verify assembled test site
        run: node tests/verify-release-artifact.mjs --environment test --site _site
      - name: Determine whether legal data changed
        id: change_check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p previous-graph
          changed=false
          for graph in _site/data/graph/*_legal_graph.json; do
            name=$(basename "$graph")
            if ! curl --fail --silent --show-error \
              "https://umeomilieuadvies.github.io/OwSelector-test/data/graph/$name" \
              --output "previous-graph/$name"; then
              changed=true
              break
            fi
            if ! cmp --silent "$graph" "previous-graph/$name"; then
              changed=true
              break
            fi
          done
          echo "should_deploy=$changed" >> "$GITHUB_OUTPUT"
          echo "Officiële gegevens gewijzigd: $changed"
      - name: Configure Pages
        if: ${{ steps.change_check.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.change_check.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: ${{ needs.build.outputs.should_deploy == 'true' }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # De bundel bevat ook officiële toelichtingen en kan bij Pages langer synchroniseren dan de standaard tien minuten.
          timeout: 1800000
  record-release:
    if: ${{ github.event_name == 'push' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    needs: deploy
    env:
      SUPABASE_URL: https://lemcbncvqcsffatsxpdq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record release and resolved issues
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python tools/record_release.py
