name: Build and deploy OwSelector to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Dagelijks 05:15 UTC: officiële BWB-bron opnieuw ophalen en vergelijken.
    - cron: '15 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.change_check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official regulations
        run: python tools/download_all.py
      - name: Build legal graphs
        run: python tools/build_all.py
      - name: Verify graphs
        run: python tools/verify_runtime.py
      - name: Assemble static site
        run: |
          mkdir -p _site/css _site/js _site/data/graph
          cp index.html help.html favicon.svg _site/
          cp css/app.css _site/css/app.css
          cp js/app.js _site/js/app.js
          cp data/external_refs.json _site/data/external_refs.json
          cp data/back_references.json _site/data/back_references.json
          cp data/graph/*_legal_graph.json _site/data/graph/
          touch _site/.nojekyll
      - name: Determine whether legal data changed
        id: change_check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p previous-graph
          changed=false
          for graph in _site/data/graph/*_legal_graph.json; do
            name=$(basename "$graph")
            if ! curl --fail --silent --show-error \
              "https://umeomilieuadvies.github.io/OwSelector/data/graph/$name" \
              --output "previous-graph/$name"; then
              changed=true
              break
            fi
            if ! cmp --silent "$graph" "previous-graph/$name"; then
              changed=true
              break
            fi
          done
          echo "should_deploy=$changed" >> "$GITHUB_OUTPUT"
          echo "Officiële gegevens gewijzigd: $changed"
      - name: Configure Pages
        if: ${{ steps.change_check.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ steps.change_check.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: ${{ needs.build.outputs.should_deploy == 'true' }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  record-release:
    if: ${{ github.event_name == 'push' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    needs: deploy
    env:
      SUPABASE_URL: https://pqpsajcjydvagrfxfeye.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record release and resolved issues
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python tools/record_release.py
